name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Authoritative gate: check-only hooks (never auto-fix) against all files.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --config .pre-commit-config.ci.yaml

  tests-light:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          # File-based, hand-balanced (~105-110 live tests each), each its own job so -n 2 never oversubscribes the 2 vCPU/7GB runner - see docs/_meta/plans/e2e-ci-resource-hardening.md Decision #1.
          # Deferred-feature files (dashboard/admin/changelog/notes_scratchpad/complexity_comparator/section_map) return with their features post-cutover.
          - name: shard-1
            files: >-
              tests/e2e/test_settings.py tests/e2e/test_search.py tests/e2e/test_home.py
              tests/e2e/test_content_width.py tests/e2e/test_content_enhancements.py
          - name: shard-2
            files: >-
              tests/e2e/test_auth.py tests/e2e/test_scroll_toc.py tests/e2e/test_navigation_polish.py
              tests/e2e/test_navigation.py tests/e2e/test_keyboard_scroll.py tests/e2e/test_ux_hotkeys_errors.py
              tests/e2e/test_security.py tests/e2e/test_data_backup.py tests/e2e/test_links.py tests/e2e/test_structure_viz.py
          - name: shard-3
            files: >-
              tests/e2e/test_line_numbers_pathing_help.py tests/e2e/test_bookmarks.py tests/e2e/test_touch_gestures.py
              tests/e2e/test_index_ux.py tests/e2e/test_offline_shelf.py tests/e2e/test_a11y_hotkeys.py
              tests/e2e/test_routing_pathing.py tests/e2e/test_recents.py tests/e2e/test_html_markup.py
              tests/e2e/test_behavioral_fixes.py tests/e2e/test_toc_overhaul.py tests/e2e/test_read_toggle.py
              tests/e2e/test_content.py
    steps:
      - uses: actions/checkout@v4

      # conftest serves out/ and only falls back to `pnpm build` when it's missing; this job has no Node.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      # Keyed on requirements-dev.txt so a pytest-playwright bump invalidates it - browser download is skipped on cache hit, apt-level --with-deps still runs every time.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Tests (e2e, light lane, ${{ matrix.shard.name }})
        run: >-
          pytest ${{ matrix.shard.files }} -q -n 2 -m "not heavy"
          --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure

      - name: Upload failure artifacts (${{ matrix.shard.name }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard.name }}
          path: test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build static site (prebuild runs content:build)
        run: pnpm build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out

  deploy:
    needs: [build]
    # PR runs build and test only; the github-pages environment rejects non-main refs anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4

  search-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate search-index.json and check it's committed
        run: |
          python3 scripts/build_search_index.py
          git diff --exit-code content/search-index.json

  backlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate backlinks.json and check it's committed
        run: |
          python3 scripts/build_search_index.py
          python3 scripts/build_backlinks.py
          git diff --exit-code content/backlinks.json

  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate broken-links.json and check it's committed
        run: |
          python3 scripts/build_search_index.py
          python3 scripts/build_broken_links.py
          git diff --exit-code content/broken-links.json

  dead-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline broken-link check across docs and HTML. content/ excluded -
      # authored wiki articles use app-internal hash routes, not real URLs.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir . './**/*.md' './**/*.html' --exclude-path content
          fail: true

  dsa-sd-check:
    runs-on: ubuntu-latest
    steps:
      # depth 2 = current commit + its parent, enough to diff a push. PR base is fetched on-demand below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scoped to changed DSA/SD articles only - full-corpus checks belong to the rater's rating cache, not CI.
      - name: Find changed DSA/SD articles
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
            # all-zeros on first push to a new ref
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          dsa_files="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'content/dsa/**/*.md' | tr '\n' ' ')"
          sd_files="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'content/system-design/**/*.md' | tr '\n' ' ')"
          echo "dsa_files=$dsa_files" >> "$GITHUB_OUTPUT"
          echo "sd_files=$sd_files" >> "$GITHUB_OUTPUT"
      - name: Run dsa-check.sh on changed DSA articles
        if: steps.changed.outputs.dsa_files != ''
        env:
          DSA_FILES: ${{ steps.changed.outputs.dsa_files }}
        run: printf '%s' "$DSA_FILES" | xargs -r ./scripts/dsa-check.sh
      - name: Run sd-check.sh on changed SD articles
        if: steps.changed.outputs.sd_files != ''
        env:
          SD_FILES: ${{ steps.changed.outputs.sd_files }}
        run: printf '%s' "$SD_FILES" | xargs -r ./scripts/sd-check.sh
      - name: No DSA/SD articles changed
        if: steps.changed.outputs.dsa_files == '' && steps.changed.outputs.sd_files == ''
        run: echo "No DSA or SD articles changed in this push/PR - skipping."

  bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate content/bridges.json (hand-authored, shape + target checks)
        run: |
          pip install jsonschema
          python3 scripts/validate_bridges.py

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/javascript
