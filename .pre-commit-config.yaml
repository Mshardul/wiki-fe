# Pre-commit hooks - local guardrails. CI (.github/workflows/ci.yml) is the authoritative gate.
# Install once: make install (or .venv/bin/pre-commit install). Run on all files: make precommit
# No top-level exclude - pre-commit ANDs it with every hook, so it's per-hook below instead.

repos:
  # ── Secrets ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        exclude: '^(\.venv/|\.pytest_cache/)'

  # ── Spelling (code, comments, project docs) ─────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        # Authored wiki content is excluded here; also skip generated/data.
        # pres = plural of <pre> elements; couldn = "couldn't" w/ escaped apostrophe.
        # ths = table-headers variable (Array.from querySelectorAll th)
        # atmost = atMost(k) sliding-window helper name in plan docs
        # allone = AllOne LeetCode data structure name
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
        args: ["--skip", "*.min.js,data,manifest.json,pnpm-lock.yaml", "--ignore-words-list", "pres,couldn,ths,atmost,allone"]

  # ── JS/CSS lint + format (Biome - standalone binary, no node_modules) ───────
  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.11"]

  # ── TS toolchain (Next migration - lib/, app/, components/, tests/) ─────────
  - repo: local
    hooks:
      - id: ts-typecheck
        name: pnpm typecheck
        language: system
        entry: pnpm typecheck
        files: '\.(ts|tsx)$'
        exclude: '^tests/e2e/'
        pass_filenames: false
      - id: ts-lint
        name: pnpm lint (eslint + biome)
        language: system
        entry: pnpm lint
        files: '\.(ts|tsx|css)$'
        exclude: '^tests/e2e/'
        pass_filenames: false

  # ── Dead links (lychee - requires: brew install lychee) ─────────────────────
  - repo: local
    hooks:
      - id: lychee
        name: lychee (dead link check)
        language: system
        entry: lychee
        args: [--offline, --no-progress, --root-dir, ".", --exclude-path, content]
        types: [markdown]
        pass_filenames: true

  # Generated content indexes + bridges validation: produced/gated by `pnpm build` (`buildContent()`).

  # ── Hygiene ─────────────────────────────────────────────────────────────────
  # content/ (1.5M of authored markdown) only excluded on the two whitespace fixers below -
  # everything else (JSON validity, secrets, symlinks, etc.) should still cover content/.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
      - id: trailing-whitespace
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: '^pnpm-lock\.yaml$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
