# CI pre-commit config - check-only, never auto-fix (authoritative gate, used by ci.yml).
# Local devs use .pre-commit-config.yaml instead, which auto-fixes.
# No top-level exclude - see .pre-commit-config.yaml for why; it's per-hook below instead.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        exclude: '^(\.venv/|\.pytest_cache/)'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
        # pres = plural of <pre> elements; couldn = "couldn't" w/ escaped apostrophe.
        # ths = table-headers variable (Array.from querySelectorAll th)
        # atmost = atMost(k) sliding-window helper name in plan docs
        args: ["--skip", "*.min.js,data,manifest.json", "--ignore-words-list", "pres,couldn,ths,atmost"]

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-ci
        additional_dependencies: ["@biomejs/biome@1.9.4"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
      - id: trailing-whitespace
        exclude: '^(content/|\.venv/|\.pytest_cache/)'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
